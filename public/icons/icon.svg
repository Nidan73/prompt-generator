<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161824" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>

    <!-- Outer Emerald Rind Gradient -->
    <linearGradient id="rindGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Inner Crisp White/Lime Rind -->
    <linearGradient id="innerRindGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <!-- Watermelon Flesh Gradient (Vibrant Crimson Coral with rich depth) -->
    <linearGradient id="fleshGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Top Specular Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- AI Magic Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for Slice -->
    <filter id="sliceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#FF3366" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Spark Glow Filter -->
    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FDE047" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />

  <!-- Center Group -->
  <g filter="url(#sliceShadow)">
    <!-- 1. Outer Green Rind Arc -->
    <path d="M 68 376 C 110 440, 402 440, 444 376 L 256 128 Z" fill="url(#rindGrad)" />

    <!-- 2. Inner White Rind Arc -->
    <path d="M 88 368 C 124 424, 388 424, 424 368 L 256 146 Z" fill="url(#innerRindGrad)" />

    <!-- 3. Red Juicy Flesh -->
    <path d="M 104 358 C 138 410, 374 410, 408 358 L 256 160 Z" fill="url(#fleshGrad)" />

    <!-- 4. Glossy Overlay -->
    <path d="M 104 358 L 256 160 L 320 240 C 260 270, 180 310, 104 358 Z" fill="url(#glossGrad)" />

    <!-- 5. Crisp Black Seeds -->
    <!-- Top Left -->
    <path d="M 224 236 C 220 224, 224 214, 229 214 C 234 214, 238 224, 224 236 Z" fill="#0f172a" />
    <!-- Top Right -->
    <path d="M 288 236 C 292 224, 288 214, 283 214 C 278 214, 274 224, 288 236 Z" fill="#0f172a" />
    <!-- Mid Left -->
    <path d="M 188 296 C 182 284, 186 274, 192 274 C 198 274, 202 284, 188 296 Z" fill="#0f172a" />
    <!-- Mid Center -->
    <path d="M 256 288 C 251 276, 256 266, 261 266 C 266 266, 270 276, 256 288 Z" fill="#0f172a" />
    <!-- Mid Right -->
    <path d="M 324 296 C 330 284, 326 274, 320 274 C 314 274, 310 284, 324 296 Z" fill="#0f172a" />
    <!-- Bottom Left -->
    <path d="M 160 352 C 154 340, 158 330, 164 330 C 170 330, 174 340, 160 352 Z" fill="#0f172a" />
    <!-- Bottom Mid-Left -->
    <path d="M 222 350 C 217 338, 222 328, 227 328 C 232 328, 236 338, 222 350 Z" fill="#0f172a" />
    <!-- Bottom Mid-Right -->
    <path d="M 290 350 C 295 338, 290 328, 285 328 C 280 328, 276 338, 290 350 Z" fill="#0f172a" />
    <!-- Bottom Right -->
    <path d="M 352 352 C 358 340, 354 330, 348 330 C 342 330, 338 340, 352 352 Z" fill="#0f172a" />
  </g>

  <!-- 6. AI Magic Spark on the Slice Tip -->
  <g transform="translate(256, 126)" filter="url(#sparkGlow)">
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="url(#sparkGrad)" />
    <!-- Core Diamond Flare -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- 7. Ambient Micro-Spark (Top Right) -->
  <g transform="translate(388, 96) scale(0.45)" opacity="0.95" filter="url(#sparkGlow)">
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FDE047" />
  </g>
</svg>