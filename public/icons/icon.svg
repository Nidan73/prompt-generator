<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Emerald Rind Spine Gradient -->
    <linearGradient id="bSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Upper Watermelon Lobe (Electric Crimson-Pink) -->
    <linearGradient id="upperLobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5277" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Lower Watermelon Lobe (Deep Coral-Ruby) -->
    <linearGradient id="lowerLobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Crisp White Separation Rim -->
    <linearGradient id="whiteRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <!-- Soft Brand Drop Shadow -->
    <filter id="bShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#E11D48" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.2" />
    </filter>

    <!-- Obsidian Seed Gradient -->
    <radialGradient id="seedDark" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <g transform="translate(45, 30)" filter="url(#bShadow)">
    
    <!-- ── 1. Left Vertical Emerald Rind Spine (The "B" Stem) ── -->
    <rect x="70" y="50" width="46" height="390" rx="23" fill="url(#bSpine)" />

    <!-- ── 2. Upper Watermelon Lobe ── -->
    <!-- White Rind Border -->
    <path
      d="M 116 50 L 230 50 C 300 50, 340 95, 340 155 C 340 215, 300 248, 230 248 L 116 248 Z"
      fill="url(#whiteRim)"
    />
    <!-- Red Flesh Core -->
    <path
      d="M 116 66 L 224 66 C 284 66, 322 102, 322 155 C 322 208, 284 232, 224 232 L 116 232 Z"
      fill="url(#upperLobe)"
    />
    <!-- Upper Lobe Teardrop Seed (Negative / Obsidian) -->
    <ellipse cx="206" cy="155" rx="14" ry="22" transform="rotate(18 206 155)" fill="url(#seedDark)" />
    <circle cx="203" cy="148" r="4" fill="#ffffff" opacity="0.75" />

    <!-- ── 3. Lower Watermelon Lobe ── -->
    <!-- White Rind Border -->
    <path
      d="M 116 236 L 246 236 C 322 236, 368 280, 368 348 C 368 416, 322 440, 246 440 L 116 440 Z"
      fill="url(#whiteRim)"
    />
    <!-- Red Flesh Core -->
    <path
      d="M 116 252 L 238 252 C 306 252, 348 290, 348 348 C 348 406, 306 424, 238 424 L 116 424 Z"
      fill="url(#lowerLobe)"
    />
    <!-- Lower Lobe Teardrop Seed 1 -->
    <ellipse cx="202" cy="348" rx="15" ry="24" transform="rotate(-15 202 348)" fill="url(#seedDark)" />
    <circle cx="199" cy="340" r="4.5" fill="#ffffff" opacity="0.75" />

    <!-- Lower Lobe Teardrop Seed 2 -->
    <ellipse cx="264" cy="348" rx="13" ry="21" transform="rotate(15 264 348)" fill="url(#seedDark)" />
    <circle cx="261" cy="341" r="3.5" fill="#ffffff" opacity="0.75" />

  </g>
</svg>