<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="cShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(256, 256) rotate(-12) translate(-256, -256)" filter="url(#cShadow)">
    <!-- Green Top Arc (Palestine Green) -->
    <path d="M 64 256 A 192 192 0 0 0 448 256 L 404 256 A 148 148 0 0 1 108 256 Z" fill="#007A3D" />
    
    <!-- White Middle Arc (Palestine White) -->
    <path d="M 108 256 A 148 148 0 0 0 404 256 L 382 256 A 126 126 0 0 1 130 256 Z" fill="#FFFFFF" />
    
    <!-- Red Inner Core (Palestine Red / Watermelon Flesh) -->
    <path d="M 130 256 A 126 126 0 0 0 382 256 Z" fill="#E4312B" />

    <!-- Black Triangle/Chevron on Left (Flag Red Chevron Motif in Black Seeds) -->
    <!-- 3 Crisp Black Seeds -->
    <circle cx="210" cy="300" r="11" fill="#000000" />
    <circle cx="256" cy="324" r="11" fill="#000000" />
    <circle cx="302" cy="300" r="11" fill="#000000" />
  </g>
</svg>